trigger:
  - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  fakeApiUrl: 'http://localhost:5000'
  libraryPath: 'src/RESTClientNet20.Library/RESTClientNet20.Library.csproj'
  testsPath: 'tests/RESTClientNet20.Tests/RESTClientNet20.Tests.csproj'

stages:
  - stage: Build
    displayName: 'Build'
    jobs:
      - job: BuildAndTest
        displayName: 'Build & Test'
        steps:

          # ── NuGet (Library + Tests ciblant .NET Framework 2.0) ─────────────
          - task: NuGetToolInstaller@1
            displayName: 'Install NuGet'

          - task: NuGetCommand@2
            displayName: 'Restore RESTClientNet20.Library'
            inputs:
              command: 'restore'
              restoreSolution: '$(libraryPath)'
              feedsToUse: 'select'

          - task: NuGetCommand@2
            displayName: 'Restore RESTClientNet20.Tests'
            inputs:
              command: 'restore'
              restoreSolution: '$(testsPath)'
              feedsToUse: 'select'

          # ── Build .NET Framework 2.0 projects via MSBuild ──────────────────
          - task: VSBuild@1
            displayName: 'Build Library (.NET Framework 2.0)'
            inputs:
              solution: '$(libraryPath)'
              configuration: '$(buildConfiguration)'

          - task: VSBuild@1
            displayName: 'Build Tests (.NET Framework 2.0)'
            inputs:
              solution: '$(testsPath)'
              configuration: '$(buildConfiguration)'        

          # ── Exécuter les tests NUnit ────────────────────────────────────────
          - task: VSTest@2
            displayName: 'Run NUnit Tests'
            inputs:
              testSelector: 'testAssemblies'
              testAssemblyVer2: |
                $(testsPath)\bin\$(buildConfiguration)\RESTClientNet20.Tests.dll
              searchFolder: '$(System.DefaultWorkingDirectory)'
              platform: 'AnyCPU'
              configuration: '$(buildConfiguration)'
              testRunTitle: 'RESTClientNet20 – NUnit Tests'
              publishRunAttachments: true

          # ── Publier les artefacts de build ─────────────────────────────────
          - task: PublishBuildArtifacts@1
            displayName: 'Publish build artifacts'
            condition: always()
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'
